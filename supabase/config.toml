# Supabase local CLI config for this white-label template.
# Remote project credentials stay in .env.local — never commit secrets.

[project]
id = "ecommerce-platform-dev"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true

# Local CLI: skip confirmation emails so signup is not blocked by mailer rate limits.
# Hosted projects: toggle Confirm email in the Supabase Auth dashboard if needed.
[auth.email]
enable_confirmations = false
enable_signup = true

[storage]
enabled = true
